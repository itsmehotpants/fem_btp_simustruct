version: "3.9"

services:
  compute_engine:
    build:
      context: .
      dockerfile: Dockerfile.compute
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - MODEL_PATH=/app/models/simustruct_surrogate.pth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.spring
    ports:
      - "8080:8080"
    environment:
      - COMPUTE_ENGINE_URL=http://compute_engine:8000
    depends_on:
      compute_engine:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8080
      - COMPUTE_ENGINE_URL=http://compute_engine:8000
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: simustruct_net
