# ============================================================
# SimuStruct AI V3 — Centralized Configuration
# B.Tech Project, LNMIIT Jaipur (2023–2027 Batch)
# ============================================================

project:
  name: "SimuStruct AI"
  version: "3.0.0"
  description: "Real-time structural analysis via Deep Learning surrogate models"

# --- Model Architecture ---
model:
  type: "enhanced_mlp"          # options: enhanced_mlp | gnn | mc_dropout_mlp
  n_freqs: 8                    # Fourier encoding frequencies
  hidden_dims: [128, 256, 256, 128]
  activation: "gelu"
  dropout_p: 0.1                # For MC Dropout uncertainty

# --- Training Hyperparameters ---
training:
  epochs: 300
  batch_size: 4096
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  scheduler: "cosine_annealing"
  lambda_pde: 0.1               # Physics loss weight
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  seed: 42

# --- Data Generation ---
data:
  n_simulations: 5000
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  log_transform_stress: true
  normalize_inputs: true

# --- Geometry Parameter Ranges ---
geometry:
  plate_width:  [0.5, 2.0]      # meters
  plate_height: [0.3, 1.5]
  n_holes:      [1, 3]
  hole_rx:      [0.02, 0.15]    # ellipse semi-axis x
  hole_ry:      [0.02, 0.15]    # ellipse semi-axis y
  hole_cx:      [0.2, 0.8]      # fractional center x
  hole_cy:      [0.2, 0.8]      # fractional center y
  mesh_size:    [0.01, 0.04]

# --- Load Ranges ---
loads:
  axial_tension:    [1.0e4, 1.0e6]    # N/m²
  transverse_shear: [1.0e4, 5.0e5]
  biaxial:          [1.0e4, 8.0e5]

# --- File Paths ---
paths:
  dataset_dir: "data/hdf5/"
  model_dir: "models/"
  checkpoint: "models/best_checkpoint.pth"
  final_model: "models/simustruct_surrogate.pth"
  scaler_path: "models/scaler.pkl"
  logs_dir: "logs/"

# --- Service URLs ---
services:
  compute_engine: "http://localhost:8000"
  spring_backend: "http://localhost:8080"
  streamlit_frontend: "http://localhost:8501"
