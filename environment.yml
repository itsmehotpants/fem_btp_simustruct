# SimuStruct AI V3 — Full Development Environment
name: simu_ai
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - h5py>=3.8
  - pyyaml>=6.0
  - pytest>=7.3
  - pip
  - pip:
    - torch>=2.0.0
    - streamlit>=1.28.0
    - fastapi>=0.100.0
    - uvicorn[standard]>=0.22.0
    - pydantic>=2.0.0
    - reportlab>=4.0.0
    - requests>=2.28.0
